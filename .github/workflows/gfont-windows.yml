name: gfont_converter — Windows exe

on:
  push:
    paths:
      - "gfont_converter/**"
      - ".github/workflows/gfont-windows.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: gfont_converter

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка через build_exe.bat (venv, зависимости, тесты, PyInstaller, самопроверка)
        shell: cmd
        run: build_exe.bat ci

      - name: Размер exe
        shell: pwsh
        run: |
          $f = Get-Item dist\GfontConverter.exe
          "EXE_SIZE_BYTES=$($f.Length)"
          "EXE_SIZE_MB={0:N1}" -f ($f.Length / 1MB)

      - name: Запуск exe без Python (PATH очищен, другая папка, путь с кириллицей)
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP "Чистый запуск с пробелом"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item dist\GfontConverter.exe $dst
          $env:PATH = "C:\Windows\System32;C:\Windows"
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $exe = Join-Path $dst GfontConverter.exe
          $font = "C:\Windows\Fonts\arial.ttf"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$font`"", "`"$dst\selftest`"" -Wait -PassThru
          Get-Content "$dst\selftest\selftest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "selftest exit $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-gui", "`"$font`"", "`"$dst\smoke`"" -Wait -PassThru
          Get-Content "$dst\smoke\smoke.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "smoke exit $($p.ExitCode)" }
          New-Item -ItemType Directory -Force ..\ci_out | Out-Null
          Copy-Item "$dst\smoke\*.png" ..\ci_out\

      - name: Обычный запуск окна (платформа windows) и снимок экрана
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath dist\GfontConverter.exe -ArgumentList "C:\Windows\Fonts\arial.ttf" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "окно закрылось само, код $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force ..\ci_out | Out-Null
          $bmp.Save((Join-Path (Resolve-Path ..\ci_out) "windows_desktop.png"))
          "окно работает, PID $($p.Id); экран $($b.Width)x$($b.Height)"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GfontConverter-exe
          path: gfont_converter/dist/GfontConverter.exe

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ci_out/

  clean-windows:
    # Чистая Windows без Python: контейнер Windows Server Core
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GfontConverter-exe
          path: t
      - name: Самопроверка в контейнере servercore (Python там нет)
        shell: pwsh
        working-directory: .
        run: |
          Copy-Item C:\Windows\Fonts\arial.ttf t\
          docker run --rm -v "${PWD}\t:C:\t" mcr.microsoft.com/windows/servercore:ltsc2022 powershell -NoProfile -Command "if (Get-Command python -ErrorAction SilentlyContinue) { 'PYTHON НАЙДЕН' } else { 'python отсутствует' }; `$p = Start-Process -FilePath C:\t\GfontConverter.exe -ArgumentList '--selftest','C:\t\arial.ttf','C:\t\out' -Wait -PassThru; Get-Content C:\t\out\selftest.txt -Encoding UTF8; `$q = Start-Process -FilePath C:\t\GfontConverter.exe -ArgumentList '--smoke-gui','C:\t\arial.ttf','C:\t\smoke' -Wait -PassThru; Get-Content C:\t\smoke\smoke.txt -Encoding UTF8; 'selftest=' + `$p.ExitCode + ' smoke=' + `$q.ExitCode; exit (`$p.ExitCode + `$q.ExitCode)"
